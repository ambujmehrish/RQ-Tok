# AdaRQ-Flow — REAL EXPERIMENT config (run_mode: experiment).
#
# MLLM half is WIRED AND VERIFIED against real Qwen2.5-VL-3B weights:
#   mllm.hidden_dim=2048      text hidden size, read off the checkpoint
#   tokenizer.clip_dim=2048   POST patch-merger visual width (what the LLM consumes;
#                             the tower-internal 1280 is NOT the bridge latent)
#   tokenizer.num_patches=64  visual tokens/image at a 16x16 grid (2x2 merged)
# Derive these for any other checkpoint with:
#   python -m adarq_flow.mllm.qwen Qwen/Qwen2.5-VL-7B-Instruct
# Do NOT hand-edit them: QwenBackbone / QwenVisionEncoder raise on a mismatch rather
# than projecting, because a silent projection changes the bridge.
#
# Renderer half is NOT wired yet: this config still FAILS LOUDLY with
# NotImplementedError on FLUX.1-dev. That is intended (ISSUES.md B3).
#
# shared_codebook=false + include_zero_code=true are REQUIRED for rate-allocation
# experiments (ISSUES.md D1/D2).
name: adarq-flow-experiment
tokenizer:
  clip_dim: 2048
  num_patches: 64
  codebook_size: 8192
  max_depth: 4
  shared_codebook: false
  include_zero_code: true
  dead_code_threshold: 0.5
  commitment_weight: 0.25
  entropy_weight: 0.01
  ema_decay: 0.99
  adaptive_depth: true
  halt_residual_threshold: 0.05
  rate_penalty: 0.001
mllm:
  backbone: Qwen/Qwen2.5-VL-3B-Instruct
  hidden_dim: 2048
  num_layers: 4
  num_heads: 16
  freeze_backbone: true
  code_head: true
  flow_residual_head: true
  residual_objective: flow
  flow_head_dim: 1024
  flow_head_layers: 2
  flow_loss_weight: 1.0
  cfg_text_dropout: 0.1
  cfg_scale: 3.0
  mask_min: 0.7
  mask_max: 1.0
  decode_steps: 16
renderer:
  backbone: black-forest-labs/FLUX.1-dev
  vae: black-forest-labs/FLUX.1-dev
  image_size: 64
  latent_dim: 32
  model_dim: 64
  num_blocks: 2
  num_heads: 4
  num_image_tokens: 16
  controlnet_double_blocks: 1
  controlnet_single_blocks: 1
  downsample_factor: 2
  flow_sigma_min: 0.0
  num_inference_steps: 8
  controlnet_conditioning_scale: 0.7
  guidance_scale: 3.5
  train_on_dequantized: true
  scheduled_sampling_prob: 0.0
train:
  run_mode: experiment
  stage: tokenizer
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0
  max_steps: 100
  grad_clip: 1.0
  seed: 0
  device: cuda
  precision: bf16
  dataset: blip3o
  log_every: 10
  ckpt_dir: checkpoints
dist:
  strategy: ddp
  backend: nccl
  find_unused_parameters: false
  bucket_cap_mb: 25
  fsdp_sharding: full
  fsdp_mixed_precision: true
  init_timeout_min: 30
  seed_per_rank: true
