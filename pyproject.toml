[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adarq_flow"
version = "0.0.1"
description = "AdaRQ-Flow: a flow-matching, adaptive residual-quantized successor to Bifrost-1 for unified multimodal understanding and generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AdaRQ-Flow authors" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy runtime deps for real (GPU) backbones. Not needed for the pure-Python scaffold tests.
torch = [
    "torch>=2.2",
    "numpy>=1.24",
]
models = [
    "transformers>=4.49",
    "diffusers>=0.31",
    "accelerate>=0.34",
    "safetensors>=0.4",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["adarq_flow*"]

[tool.setuptools.package-data]
adarq_flow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "E741",  # ambiguous names (intentional math: t, k, d in tensor code)
]

[tool.ruff.lint.per-file-ignores]
# Tests use pytest.importorskip(torch) before imports; scripts adjust sys.path.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Pragmatic: tensor-heavy code is hard to fully annotate; check defs that have hints.
check_untyped_defs = true
exclude = ["tests/", "scripts/"]
