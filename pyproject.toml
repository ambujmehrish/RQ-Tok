[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost_flow"
version = "0.0.1"
description = "Bifrost-Flow: a flow-matching, adaptive residual-quantized successor to Bifrost-1 for unified multimodal understanding and generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bifrost-Flow authors" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy runtime deps for real (GPU) backbones. Not needed for the pure-Python scaffold tests.
torch = [
    "torch>=2.2",
    "numpy>=1.24",
]
models = [
    "transformers>=4.49",
    "diffusers>=0.31",
    "accelerate>=0.34",
    "safetensors>=0.4",
]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["bifrost_flow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
